<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NESH</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0B2545">
<link rel="apple-touch-icon" href="./icon-512.png">
<link rel="icon" href="./icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  body{
    margin:0; background:#0B2545; font-family:'Inter',sans-serif;
    display:flex; justify-content:center; align-items:center; min-height:100vh;
  }
  #app{ width:100%; max-width:420px; min-height:100vh; padding:24px; display:flex;
        flex-direction:column; justify-content:center; gap:16px; }
  h1{ color:#fff; font-family:'Fraunces',serif; font-size:30px; text-align:center; margin:0 0 8px; }
  p{ color:#A9C4E0; text-align:center; margin:0 0 24px; font-size:14px; }
  .choice{
    display:block; width:100%; padding:20px; border-radius:14px; border:1px solid #1D4E7A;
    background:#123A5E; color:#fff; font-size:17px; font-weight:600; text-align:left;
    cursor:pointer;
  }
  .choice small{ display:block; color:#A9C4E0; font-weight:400; font-size:13px; margin-top:4px; }
  .choice:active{ transform:scale(0.98); }
</style>
</head>
<body>
<div id="app">
  <h1>NESH</h1>
  <p>Choose which portal to open</p>
  <button class="choice" onclick="go('driver')">
    Driver
    <small>Accept rides &amp; delivery jobs</small>
  </button>
  <button class="choice" onclick="go('partner')">
    Restaurant Partner
    <small>Manage incoming orders</small>
  </button>
</div>
<script>
  // Remember the last portal chosen so re-opening the app after a normal
  // (non-notification) launch goes straight back in, instead of asking
  // again every time. A native ringing-screen launch always overrides
  // this by having MainActivity load driver.html/partner.html directly.
  function go(portal){
    localStorage.setItem('nesh_portal', portal);
    window.location.href = portal === 'driver' ? 'driver.html' : 'partner.html';
  }
  (function(){
    var last = localStorage.getItem('nesh_portal');
    if (last === 'driver' || last === 'partner') {
      window.location.href = last + '.html';
    }
  })();
</script>
</body>
</html>
