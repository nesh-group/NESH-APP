      # @capacitor/local-notifications auto-merges SCHEDULE_EXACT_ALARM into
      # the manifest via its own library AndroidManifest.xml, even though
      # this app only shows notifications immediately (no future/exact-time
      # scheduling anywhere in index.html). Google requires a Play Console
      # "Permissions declaration" for that permission and can reject builds
      # that carry it without one, so explicitly strip it back out at merge
      # time instead of declaring it. If exact-time scheduled reminders are
      # ever added to the app later, remove this step and fill out that
      # declaration form instead.
      - name: Remove unused SCHEDULE_EXACT_ALARM permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'xmlns:tools=' "$MANIFEST"; then
            sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' "$MANIFEST"
          fi
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" tools:node="remove" />#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Sync web assets into Android project
        run: npx cap sync android

      # versionCode 13 (1.0.12) may already be uploaded to Play Console, and every
      # new upload must have a strictly higher versionCode, so this build
      # uses 14. versionName is only the label users see (1.0.13).
      # This build: versionCode 16 / 1.0.15 (previous upload used 15). Raise both again for every Play upload.
      - name: Set version code and name
        run: |
          sed -i "s/versionCode 1/versionCode 16/" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.15"/' android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Fix Kotlin stdlib duplicate class conflict
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      # Restore the SAME keystore used for the app currently live on
      # Play Store. It is stored as a base64 GitHub secret so the raw
      # file never sits in the repo.
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.NESH_KEYSTORE_BASE64 }}" | base64 -d > android/app/signing.keystore

      # Debug aid for Firebase phone-OTP. Prints the UPLOAD key SHA-1 / SHA-256 (public fingerprints, not secrets)
      # and what google-services.json knows. NOTE: apps installed from Play Store are re-signed by Google with the
      # "App signing key" - its SHA-1 AND SHA-256 (Play Console > Test and release > App integrity) must ALSO be added
      # in Firebase > Project settings > your Android app, otherwise OTP can fail only for Play Store installs.
      # This step never fails the build; it only prints / warns.
      - name: Show signing fingerprints + google-services.json check (OTP debug)
        env:
          KS_PASS: ${{ secrets.NESH_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.NESH_KEY_ALIAS }}
        run: |
          keytool -list -v -keystore android/app/signing.keystore -alias "$KS_ALIAS" -storepass "$KS_PASS" 2>/dev/null | grep -E "SHA1:|SHA256:" || echo "::warning::could not read the upload key fingerprints"
          python3 - << 'PYEOF'
          import json
          try:
              d = json.load(open("google-services.json"))
              found = False
              for c in d.get("client", []):
                  pkg = c["client_info"]["android_client_info"]["package_name"]
                  hashes = [o["android_info"].get("certificate_hash") for o in c.get("oauth_client", []) if o.get("android_info")]
                  print("google-services.json package:", pkg, "| SHA-1 registered:", hashes)
                  if pkg == "com.neshgroup.nesh":
                      found = True
                      if not hashes:
                          print("::warning::No SHA-1 is registered for com.neshgroup.nesh in google-services.json - add the upload key AND the Play App Signing key SHA-1/SHA-256 in Firebase, then replace google-services.json")
              if not found:
                  print("::warning::google-services.json has no entry for com.neshgroup.nesh")
          except Exception as e:
              print("::warning::could not read google-services.json:", e)
          PYEOF

      # Wire the keystore into the release build type so `bundleRelease`
      # outputs an already-signed AAB, matching the existing app's signature.
      - name: Add signing config to build.gradle
        run: |
          python3 - << 'PYEOF'
          import re

          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("signing.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
          content = content.replace("android {", "android {\n" + signing_block, 1)

          # Insert a fresh release{} block right after buildTypes { rather
          # than editing the existing one — Gradle merges repeated blocks
          # for the same build type, so this avoids fragile text matching.
          content = re.sub(
              r"(buildTypes\s*\{)",
              r"\1\n        release {\n            signingConfig signingConfigs.release\n        }",
              content,
              count=1,
          )

          with open(path, "w") as f:
              f.write(content)
          PYEOF
          cat android/app/build.gradle

      # Downloads Gradle itself first, retrying up to 4 times. A one-off network
      # hiccup here no longer fails the whole build.
      - name: Download Gradle (with retries)
        working-directory: android
        run: |
          chmod +x ./gradlew
          for i in 1 2 3 4; do
            ./gradlew --version && exit 0
            echo "Gradle download failed (try $i), retrying in 20s..."
            sleep 20
          done
          exit 1

      # AAB is what Play Store requires for the actual store listing.
      # APK is built too so you (or testers) can sideload-install it
      # directly on a phone without going through Play Console at all —
      # both come from the same signed release config, same keystore.
      - name: Build signed release AAB and APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.NESH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NESH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NESH_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      # Prints every permission the final app declares (names only). Check this BEFORE uploading to Play.
      - name: Show merged permissions
        run: |
          M=$(find android/app/build -name AndroidManifest.xml -path '*merged_manifests*' | head -1)
          echo "file: $M"
          grep -E 'uses-permission|uses-feature' "$M" | sed -E 's/^ +//' || true

      # Zips the exact www/ folder that went into the app and publishes it to the TEST channel
      # on Cloudflare R2 (bucket nesh-ota, folder test/). Only your own phone gets it until you run "Promote OTA to production".
      - name: Build OTA bundle and publish to TEST channel (R2)
        if: ${{ vars.OTA_UPDATE_URL != '' && inputs.skip_ota != true }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTA_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTA_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.OTA_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.OTA_R2_BUCKET }}
        run: |
          set -e
          VC=$(grep -oE 'versionCode [0-9]+' android/app/build.gradle | head -1 | grep -oE '[0-9]+')
          VN=$(grep -oE 'versionName "[^"]+"' android/app/build.gradle | head -1 | cut -d'"' -f2)
          VER="1.${VC}.${{ github.run_number }}"
          ZIP="nesh-bundle-${VER}.zip"
          (cd www && zip -qr "../${ZIP}" .)
          SUM=$(sha256sum "$ZIP" | cut -d' ' -f1)
          ls -l "$ZIP"
          cat > manifest.json << EOF
          {"version":"${VER}","zip":"${ZIP}","checksum":"${SUM}","native_build":${VC},"native_name":"${VN}"}
          EOF
          # --- delta update: one object per file in www/, named by its SHA-256 (same content = same object, uploaded once) ---
          python3 - << 'PYEOF'
          import hashlib, json, os
          files = []
          for root, _, names in os.walk("www"):
              for n in sorted(names):
                  fp = os.path.join(root, n)
                  rel = os.path.relpath(fp, "www").replace(os.sep, "/")
                  files.append({"file_name": rel, "file_hash": hashlib.sha256(open(fp, "rb").read()).hexdigest(), "file_size": os.path.getsize(fp)})
          m = json.load(open("manifest.json"))
          m["files"] = files
          json.dump(m, open("manifest.json", "w"), separators=(",", ":"))
          json.dump(files, open("files.json", "w"))
          print("delta files:", len(files))
          PYEOF
          cat manifest.json | head -c 600; echo
          have=$(aws s3 ls "s3://${R2_BUCKET}/test/files/" --endpoint-url "$R2_ENDPOINT" | awk '{print $4}' | sort -u || true)
          python3 -c "import json;[print(f['file_hash'], f['file_name']) for f in json.load(open('files.json'))]" | sort -u -k1,1 | while read H NAME; do
            echo "$have" | grep -qx "$H" && continue
            case "$NAME" in *.html) CT=text/html;; *.js) CT=application/javascript;; *.css) CT=text/css;; *.json) CT=application/json;; *.svg) CT=image/svg+xml;; *) CT=application/octet-stream;; esac
            aws s3 cp "www/$NAME" "s3://${R2_BUCKET}/test/files/$H" --endpoint-url "$R2_ENDPOINT" --content-type "$CT" --cache-control "public, max-age=31536000, immutable" --only-show-errors
          done
          echo "delta files uploaded"
          # zip first, manifest last: phones never see a manifest whose zip is not there yet
          aws s3 cp "$ZIP" "s3://${R2_BUCKET}/test/${ZIP}" --endpoint-url "$R2_ENDPOINT" --content-type application/zip --cache-control "public, max-age=31536000, immutable"
          aws s3 cp manifest.json "s3://${R2_BUCKET}/test/manifest.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control "no-cache"
          # keep only the newest zip in test/
          for A in $(aws s3 ls "s3://${R2_BUCKET}/test/" --endpoint-url "$R2_ENDPOINT" | awk '{print $4}' | grep -E '^nesh-bundle-.*\.zip$'); do
            [ "$A" = "$ZIP" ] || aws s3 rm "s3://${R2_BUCKET}/test/$A" --endpoint-url "$R2_ENDPOINT"
          done
          # the public address must serve the new zip
          curl -fsI --retry 3 --retry-delay 3 "https://ota.neshapp.in/test/${ZIP}" >/dev/null && echo "public URL ok" || echo "::warning::https://ota.neshapp.in/test/${ZIP} is not reachable - check the custom domain"
          echo "OTA bundle $VER published to the TEST channel (R2)"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesh-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesh-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
