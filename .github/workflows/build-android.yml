      # Refer & Earn: Google Play Install Referrer. A friend who installs from the
      # share link (play.google.com/...&referrer=ref%3DCODE) opens the app for the
      # first time -> this tiny native plugin hands "ref=CODE" to index.html, which
      # pre-fills / auto-applies the friend's code. Plugin name: NeshReferrer.
      - name: Install Referrer plugin (Refer & Earn code from Play Store link)
        run: |
          python3 - << 'PYEOF'
          import glob, os
          F = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)[0]
          D = os.path.dirname(F)
          pkg = [l for l in open(F) if l.startswith("package ")][0].strip()
          open(D + "/NeshReferrerPlugin.java", "w").write(pkg + """

          import com.android.installreferrer.api.InstallReferrerClient;
          import com.android.installreferrer.api.InstallReferrerStateListener;
          import com.android.installreferrer.api.ReferrerDetails;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "NeshReferrer")
          public class NeshReferrerPlugin extends Plugin {
              private static void answer(PluginCall call, String ref) {
                  try {
                      JSObject o = new JSObject();
                      o.put("referrer", ref == null ? "" : ref);
                      call.resolve(o);
                  } catch (Throwable ignored) { }
              }

              @PluginMethod
              public void getReferrer(final PluginCall call) {
                  try {
                      final InstallReferrerClient client = InstallReferrerClient.newBuilder(getContext()).build();
                      client.startConnection(new InstallReferrerStateListener() {
                          @Override
                          public void onInstallReferrerSetupFinished(int code) {
                              String ref = "";
                              try {
                                  if (code == InstallReferrerClient.InstallReferrerResponse.OK) {
                                      ReferrerDetails d = client.getInstallReferrer();
                                      ref = d.getInstallReferrer();
                                  }
                              } catch (Throwable t) { ref = ""; }
                              try { client.endConnection(); } catch (Throwable t) { }
                              answer(call, ref);
                          }

                          @Override
                          public void onInstallReferrerServiceDisconnected() { }
                      });
                  } catch (Throwable t) {
                      answer(call, "");
                  }
              }
          }
          """.replace("\n          ", "\n"))
