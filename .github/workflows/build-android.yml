name: Build Customer App AAB (Signed Release)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'splash.png'
      - 'google-services.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web assets folder
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || true
          cp sw.js www/ || true
          cp icon-192.png www/ || true
          cp icon-512.png www/ || true

      - name: Init npm + install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          npm install @capacitor/app
          npm install @capacitor/geolocation
          npm install @capacitor/push-notifications
          npm install @capacitor/local-notifications
          npm install @capacitor/status-bar
          npm install @capacitor/assets --save-dev

      # IMPORTANT: appId must stay exactly the same as the package name
      # already live on Play Store (com.neshgroup.nesh), otherwise Play
      # Console will treat this as a brand-new app instead of an update.
      - name: Create capacitor.config.json
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.neshgroup.nesh",
            "appName": "NESH",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Force target SDK 36 + newer Gradle/AGP
        run: |
          sed -i -E 's/compileSdkVersion = [0-9]+/compileSdkVersion = 36/; s/targetSdkVersion = [0-9]+/targetSdkVersion = 36/' android/variables.gradle
          sed -i -E "s#(com.android.tools.build:gradle:)[0-9.]+#\18.9.1#" android/build.gradle
          sed -i -E 's#gradle-[0-9.]+-(all|bin).zip#gradle-8.11.1-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          cat android/variables.gradle
          grep "com.android.tools.build:gradle" android/build.gradle
          cat android/gradle/wrapper/gradle-wrapper.properties

      # Wires up Firebase Cloud Messaging (needed for push notifications).
      # google-services.json is committed to the repo root — it's a
      # client config file, not a secret, so it's fine to keep in git
      # (Firebase does not treat it as sensitive).
      - name: Add Firebase config for push notifications
        run: |
          cp google-services.json android/app/google-services.json
          sed -i "s#classpath 'com.android.tools.build:gradle.*#&\n        classpath 'com.google.gms:google-services:4.4.2'#" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          grep -n "google-services" android/build.gradle android/app/build.gradle

      - name: Generate app icon from icon-512.png
        run: |
          mkdir -p assets
          cp icon-512.png assets/icon.png
          cp splash.png assets/splash.png
          npx capacitor-assets generate --android

      - name: Add location permissions to AndroidManifest.xml
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />#' android/app/src/main/AndroidManifest.xml

      # @capacitor/local-notifications auto-merges SCHEDULE_EXACT_ALARM into
      # the manifest via its own library AndroidManifest.xml, even though
      # this app only shows notifications immediately (no future/exact-time
      # scheduling anywhere in index.html). Google requires a Play Console
      # "Permissions declaration" for that permission and can reject builds
      # that carry it without one, so explicitly strip it back out at merge
      # time instead of declaring it. If exact-time scheduled reminders are
      # ever added to the app later, remove this step and fill out that
      # declaration form instead.
      - name: Remove unused SCHEDULE_EXACT_ALARM permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'xmlns:tools=' "$MANIFEST"; then
            sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' "$MANIFEST"
          fi
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" tools:node="remove" />#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Sync web assets into Android project
        run: npx cap sync android

      # Play Store's current live versionCode is 3 (the previous closed-testing
      # build already installed on devices). Every new upload must have a
      # strictly higher versionCode, so this is bumped to 4 here.
      - name: Set version code and name
        run: |
          sed -i "s/versionCode 1/versionCode 4/" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.3"/' android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Fix Kotlin stdlib duplicate class conflict
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      # Restore the SAME keystore used for the app currently live on
      # Play Store. It is stored as a base64 GitHub secret so the raw
      # file never sits in the repo.
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.NESH_KEYSTORE_BASE64 }}" | base64 -d > android/app/signing.keystore

      # Wire the keystore into the release build type so `bundleRelease`
      # outputs an already-signed AAB, matching the existing app's signature.
      - name: Add signing config to build.gradle
        run: |
          python3 - << 'PYEOF'
          import re

          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("signing.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
          content = content.replace("android {", "android {\n" + signing_block, 1)

          # Insert a fresh release{} block right after buildTypes { rather
          # than editing the existing one — Gradle merges repeated blocks
          # for the same build type, so this avoids fragile text matching.
          content = re.sub(
              r"(buildTypes\s*\{)",
              r"\1\n        release {\n            signingConfig signingConfigs.release\n        }",
              content,
              count=1,
          )

          with open(path, "w") as f:
              f.write(content)
          PYEOF
          cat android/app/build.gradle

      # AAB is what Play Store requires for the actual store listing.
      # APK is built too so you (or testers) can sideload-install it
      # directly on a phone without going through Play Console at all —
      # both come from the same signed release config, same keystore.
      - name: Build signed release AAB and APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.NESH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NESH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NESH_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesh-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesh-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
