name: Build Customer App AAB (Signed Release)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'icon-1024.png'
      - 'splash.png'
      - 'google-services.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web assets folder
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || true
          cp sw.js www/ || true
          cp icon-192.png www/ || true
          cp icon-512.png www/ || true
          cp icon-1024.png www/ || true

      - name: Init npm + install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          npm install @capacitor/app
          npm install @capacitor/geolocation
          npm install @capacitor/push-notifications
          npm install @capacitor/local-notifications
          npm install @capacitor/assets --save-dev

      # IMPORTANT: appId must stay exactly the same as the package name
      # already live on Play Store (com.neshgroup.nesh), otherwise Play
      # Console will treat this as a brand-new app instead of an update.
      - name: Create capacitor.config.json
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.neshgroup.nesh",
            "appName": "NESH",
            "webDir": "www",
            "backgroundColor": "#F2B705",
            "android": {
              "adjustMarginsForEdgeToEdge": "disable"
            },
            "plugins": {
              "SystemBars": {
                "insetsHandling": "disable"
              },
              "SplashScreen": {
                "launchShowDuration": 0,
                "launchAutoHide": true,
                "backgroundColor": "#F2B705",
                "showSpinner": false
              }
            }
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Force target SDK 36 + newer Gradle/AGP
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 24/; s/compileSdkVersion = [0-9]+/compileSdkVersion = 36/; s/targetSdkVersion = [0-9]+/targetSdkVersion = 36/' android/variables.gradle
          sed -i -E "s#(com.android.tools.build:gradle:)[0-9.]+#\18.9.1#" android/build.gradle
          sed -i -E 's#gradle-[0-9.]+-(all|bin).zip#gradle-8.11.1-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          cat android/variables.gradle
          grep "com.android.tools.build:gradle" android/build.gradle
          cat android/gradle/wrapper/gradle-wrapper.properties

      # Wires up Firebase Cloud Messaging (needed for push notifications).
      # google-services.json is committed to the repo root — it's a
      # client config file, not a secret, so it's fine to keep in git
      # (Firebase does not treat it as sensitive).
      - name: Add Firebase config for push notifications
        run: |
          cp google-services.json android/app/google-services.json
          sed -i "s#classpath 'com.android.tools.build:gradle.*#&\n        classpath 'com.google.gms:google-services:4.4.2'#" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          grep -n "google-services" android/build.gradle android/app/build.gradle

      # The native splash (shown by Android before the WebView loads) must be
      # a plain yellow screen - no logo, no dark background - so it blends
      # straight into the in-app "Locating..." splash in index.html.
      # splash.png is replaced by a generated solid #F2B705 image.
      - name: Generate app icon + plain yellow splash
        run: |
          mkdir -p assets
          pip install pillow -q
          # Legacy (square/round) launcher icons: the full glossy icon.
          cp icon-1024.png assets/icon-only.png
          # Adaptive icon (Android 8+): Android crops the outer ~1/3 with a
          # circle/squircle mask, so the icon is shrunk into the safe zone on
          # a transparent layer, over a solid brand-yellow background layer.
          python3 - << 'PYEOF'
          from PIL import Image
          ic = Image.open('icon-1024.png').convert('RGBA')
          fg = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          small = ic.resize((600, 600), Image.LANCZOS)
          fg.paste(small, (212, 212), small)
          fg.save('assets/icon-foreground.png')
          Image.new('RGB', (1024, 1024), (0xF2, 0xB7, 0x05)).save('assets/icon-background.png')
          PYEOF
          python3 - << 'PYEOF'
          import zlib, struct
          W = H = 2732
          def chunk(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          raw = (b'\x00' + bytes([0xF2, 0xB7, 0x05]) * W) * H
          png = (b'\x89PNG\r\n\x1a\n'
                 + chunk(b'IHDR', struct.pack('>IIBBBBB', W, H, 8, 2, 0, 0, 0))
                 + chunk(b'IDAT', zlib.compress(raw, 9))
                 + chunk(b'IEND', b''))
          open('assets/splash.png', 'wb').write(png)
          PYEOF
          npx capacitor-assets generate --android \
            --splashBackgroundColor '#F2B705' \
            --splashBackgroundColorDark '#F2B705'

      # Android 12+ ignores splash.png and draws its own splash (app icon on
      # a dark/theme background). Force that one to yellow with no icon too.
      - name: Make Android 12+ system splash yellow (no icon)
        run: |
          python3 - << 'PYEOF'
          import re
          path = "android/app/src/main/res/values/styles.xml"
          s = open(path).read()
          m = re.search(r'<style name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>', s, re.S)
          assert m, "NoActionBarLaunch style not found"
          block = m.group(0)
          if 'Theme.SplashScreen' in block:
              extra = (
                  '\n        <item name="windowSplashScreenBackground">#F2B705</item>'
                  '\n        <item name="windowSplashScreenAnimatedIcon">@android:color/transparent</item>'
                  '\n    </style>'
              )
              s = s.replace(block, block.replace('</style>', extra))
              open(path, "w").write(s)
          print(open(path).read())
          PYEOF
          # Dark-mode variant (if the template ships one) must not override it
          rm -f android/app/src/main/res/values-night/styles.xml || true

      # Status bar (top bar with time/battery) must be yellow, not dark grey.
      # Set it natively in the app theme so it works without relying on JS.
      - name: Make status bar yellow in Android theme
        run: |
          python3 - << 'PYEOF'
          import re
          path = "android/app/src/main/res/values/styles.xml"
          s = open(path).read()
          extra = (
              '\n        <item name="android:windowLightStatusBar">true</item>'
              '\n        <item name="android:statusBarColor">@android:color/transparent</item>'
              '\n        <item name="android:windowBackground">#F2B705</item>'
              '\n    </style>'
          )
          for name in ("AppTheme.NoActionBar", "AppTheme.NoActionBarLaunch"):
              m = re.search(r'<style name="%s"[^>]*>.*?</style>' % re.escape(name), s, re.S)
              if m:
                  s = s.replace(m.group(0), m.group(0).replace('</style>', extra))
          open(path, "w").write(s)
          print(s)
          PYEOF

      # On Android 15/16 the system ignores statusBarColor, and the strip
      # behind the status bar shows the WINDOW background instead. Paint it
      # yellow from MainActivity. Also registers a tiny native plugin
      # (NeshLocation) used ONLY when the customer taps "Turn on location"
      # in the popup: shows Google's own "Turn on device location? OK" dialog.
      - name: MainActivity (yellow window) + native "turn on GPS" dialog
        run: |
          python3 - << 'PYEOF'
          import glob, os
          F = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)[0]
          D = os.path.dirname(F)
          pkg = [l for l in open(F) if l.startswith("package ")][0].strip()
          open(F, "w").write(pkg + """

          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NeshLocationPlugin.class);
                  super.onCreate(savedInstanceState);

                  // Edge-to-edge done the recommended way (all Android versions):
                  // the app draws edge-to-edge, and we pad the content by the
                  // system bar insets. The yellow window background shows behind
                  // the status bar. No deprecated status-bar colour APIs used.
                  Window w = getWindow();
                  WindowCompat.setDecorFitsSystemWindows(w, false);
                  w.setBackgroundDrawable(new ColorDrawable(Color.parseColor("#F2B705")));
                  WindowCompat.getInsetsController(w, w.getDecorView()).setAppearanceLightStatusBars(true);

                  View content = findViewById(android.R.id.content);
                  ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                      Insets bars = insets.getInsets(
                          WindowInsetsCompat.Type.systemBars()
                          | WindowInsetsCompat.Type.displayCutout()
                          | WindowInsetsCompat.Type.ime());
                      v.setPadding(bars.left, bars.top, bars.right, bars.bottom);
                      return WindowInsetsCompat.CONSUMED;
                  });
                  ViewCompat.requestApplyInsets(content);
              }
          }
          """.replace("\n          ", "\n"))
          open(D + "/NeshLocationPlugin.java", "w").write(pkg + """

          import androidx.activity.ComponentActivity;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.IntentSenderRequest;
          import androidx.activity.result.contract.ActivityResultContracts;
          import android.app.Activity;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.google.android.gms.common.api.ResolvableApiException;
          import com.google.android.gms.location.LocationRequest;
          import com.google.android.gms.location.LocationServices;
          import com.google.android.gms.location.LocationSettingsRequest;
          import com.google.android.gms.location.Priority;

          @CapacitorPlugin(name = "NeshLocation")
          public class NeshLocationPlugin extends Plugin {
              private PluginCall pending;
              private ActivityResultLauncher<IntentSenderRequest> launcher;

              @Override
              public void load() {
                  try {
                      ComponentActivity act = (ComponentActivity) getActivity();
                      launcher = act.getActivityResultRegistry().register(
                          "nesh_location_settings",
                          new ActivityResultContracts.StartIntentSenderForResult(),
                          result -> {
                              PluginCall c = pending;
                              pending = null;
                              if (c != null) done(c, result.getResultCode() == Activity.RESULT_OK ? "on" : "declined");
                          });
                  } catch (Throwable t) {
                      launcher = null;
                  }
              }

              // state: "on" (GPS is on), "declined" (user tapped No thanks), "error" (could not ask)
              private void done(PluginCall call, String state) {
                  try {
                      JSObject o = new JSObject();
                      o.put("enabled", "on".equals(state));
                      o.put("declined", "declined".equals(state));
                      o.put("state", state);
                      call.resolve(o);
                  } catch (Throwable ignored) { }
              }

              @PluginMethod
              public void enable(final PluginCall call) {
                  try {
                      if (getActivity() == null || launcher == null || pending != null) { done(call, "error"); return; }
                      LocationRequest req = new LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, 10000).build();
                      LocationSettingsRequest lsr = new LocationSettingsRequest.Builder()
                          .addLocationRequest(req).setAlwaysShow(true).build();
                      LocationServices.getSettingsClient(getActivity()).checkLocationSettings(lsr)
                          .addOnSuccessListener(r -> done(call, "on"))
                          .addOnFailureListener(e -> {
                              try {
                                  if (e instanceof ResolvableApiException) {
                                      pending = call;
                                      launcher.launch(new IntentSenderRequest.Builder(
                                          ((ResolvableApiException) e).getResolution()).build());
                                  } else {
                                      done(call, "error");
                                  }
                              } catch (Throwable t) {
                                  pending = null;
                                  done(call, "error");
                              }
                          });
                  } catch (Throwable t) {
                      pending = null;
                      done(call, "error");
                  }
              }
          }
          """.replace("\n          ", "\n"))
          PYEOF
          # Google Play Services location (for the "Turn on GPS" dialog)
          printf '\ndependencies {\n    implementation "com.google.android.gms:play-services-location:21.3.0"\n}\n' >> android/app/build.gradle
          cat android/app/src/main/java/com/neshgroup/nesh/*.java

      # Location + POST_NOTIFICATIONS (Android 13+ will not even show the
      # notification permission dialog unless the app declares it).
      - name: Add location + notification permissions to AndroidManifest.xml
        run: |
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />#' android/app/src/main/AndroidManifest.xml

      # @capacitor/local-notifications auto-merges SCHEDULE_EXACT_ALARM into
      # the manifest via its own library AndroidManifest.xml, even though
      # this app only shows notifications immediately (no future/exact-time
      # scheduling anywhere in index.html). Google requires a Play Console
      # "Permissions declaration" for that permission and can reject builds
      # that carry it without one, so explicitly strip it back out at merge
      # time instead of declaring it. If exact-time scheduled reminders are
      # ever added to the app later, remove this step and fill out that
      # declaration form instead.
      - name: Remove unused SCHEDULE_EXACT_ALARM permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'xmlns:tools=' "$MANIFEST"; then
            sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' "$MANIFEST"
          fi
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" tools:node="remove" />#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Sync web assets into Android project
        run: npx cap sync android

      # Previous upload used versionCode 6 (versionName 1.0.5). Every new
      # upload must have a strictly higher versionCode, so this is bumped to
      # 7 here. versionName is only the label users see (1.0.6).
      - name: Set version code and name
        run: |
          sed -i "s/versionCode 1/versionCode 7/" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.0.6"/' android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Fix Kotlin stdlib duplicate class conflict
        run: |
          cat >> android/app/build.gradle << 'EOF'

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      # Restore the SAME keystore used for the app currently live on
      # Play Store. It is stored as a base64 GitHub secret so the raw
      # file never sits in the repo.
      - name: Decode signing keystore
        run: |
          echo "${{ secrets.NESH_KEYSTORE_BASE64 }}" | base64 -d > android/app/signing.keystore

      # Wire the keystore into the release build type so `bundleRelease`
      # outputs an already-signed AAB, matching the existing app's signature.
      - name: Add signing config to build.gradle
        run: |
          python3 - << 'PYEOF'
          import re

          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()

          signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("signing.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
          content = content.replace("android {", "android {\n" + signing_block, 1)

          # Insert a fresh release{} block right after buildTypes { rather
          # than editing the existing one — Gradle merges repeated blocks
          # for the same build type, so this avoids fragile text matching.
          content = re.sub(
              r"(buildTypes\s*\{)",
              r"\1\n        release {\n            signingConfig signingConfigs.release\n        }",
              content,
              count=1,
          )

          with open(path, "w") as f:
              f.write(content)
          PYEOF
          cat android/app/build.gradle

      # AAB is what Play Store requires for the actual store listing.
      # APK is built too so you (or testers) can sideload-install it
      # directly on a phone without going through Play Console at all —
      # both come from the same signed release config, same keystore.
      - name: Build signed release AAB and APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.NESH_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NESH_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NESH_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesh-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nesh-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
