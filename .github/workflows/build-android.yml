name: Build Customer App AAB (Signed Release)

on:
  workflow_dispatch:
    inputs:
      skip_smoke_test:
        description: 'Skip the pre-build "shops load" check (only if the check itself is wrong)'
        type: boolean
        default: false
      skip_minify:
        description: 'Skip the app-only minify step (tick only if the app misbehaves after minify)'
        type: boolean
        default: false
      skip_ota:
        description: 'Do not publish the live-update (OTA) bundle to the TEST channel'
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'icon-1024.png'
      - 'splash.png'
      - 'google-services.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the OTA bundle as a GitHub Release asset
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web assets folder
        run: |
          mkdir -p www
          cp index.html www/
          cp manifest.json www/ || true
          cp sw.js www/ || true
          cp icon-192.png www/ || true
          cp icon-512.png www/ || true
          cp icon-1024.png www/ || true

      # Downloads fonts, Leaflet, Firebase compat scripts and the fixed
      # Unsplash stock images at build time and bundles them INTO THE APP
      # only (www/ copy). The repo's index.html (website) is not changed.
      # Shop/item photos from Firebase stay online. Each download is
      # wrapped in try/except: if one fails, that link just stays online.
      - name: Bundle fonts, Leaflet, Firebase and stock images
        run: |
          python3 - << 'PYEOF'
          import re, os, hashlib, urllib.request
          UA = "Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Mobile Safari/537.36"
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": UA})
              return urllib.request.urlopen(r, timeout=60).read()
          B = "www/web-assets"
          for d in ("fonts", "leaflet/images", "firebase", "img"):
              os.makedirs(B + "/" + d, exist_ok=True)
          html = open("www/index.html", encoding="utf-8").read()

          # Google Fonts
          try:
              gf = re.search(r'https://fonts\.googleapis\.com/css2\?[^"\'\s]+', html).group(0)
              css = get(gf.replace("&amp;", "&")).decode()
              for i, u in enumerate(sorted(set(re.findall(r'url\((https://fonts\.gstatic\.com/[^)]+)\)', css)))):
                  name = "f%d.woff2" % i
                  open(B + "/fonts/" + name, "wb").write(get(u))
                  css = css.replace(u, name)
              open(B + "/fonts/fonts.css", "w").write(css)
              html = html.replace(gf, "web-assets/fonts/fonts.css")
              print("fonts ok")
          except Exception as e:
              print("fonts skipped:", e)

          # Leaflet
          L = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/"
          try:
              for n in ("leaflet.min.css", "leaflet.min.js"):
                  open(B + "/leaflet/" + n, "wb").write(get(L + n))
                  html = html.replace(L + n, "web-assets/leaflet/" + n)
              for n in ("layers.png", "layers-2x.png", "marker-icon.png", "marker-icon-2x.png", "marker-shadow.png"):
                  open(B + "/leaflet/images/" + n, "wb").write(get(L + "images/" + n))
              print("leaflet ok")
          except Exception as e:
              print("leaflet skipped:", e)

          # Firebase (compat scripts only)
          G = "https://www.gstatic.com/firebasejs/10.12.0/"
          for n in ("firebase-app-compat.js", "firebase-messaging-compat.js"):
              try:
                  open(B + "/firebase/" + n, "wb").write(get(G + n))
                  html = html.replace(G + n, "web-assets/firebase/" + n)
                  print(n, "ok")
              except Exception as e:
                  print(n, "skipped:", e)

          # Firebase ES modules (firebase-app.js + firebase-database.js).
          # IMPORTANT: inside `import ... from "..."` a path must start with "./"
          # (a bare "web-assets/..." is treated as a package name and the whole
          # module script dies -> no shops). That was the earlier bug.
          # All-or-nothing: if only one were local the app would run two
          # separate Firebase instances and the database would break.
          try:
              mods = {}
              for n in ("firebase-app.js", "firebase-database.js"):
                  mods[n] = get(G + n).decode("utf-8")
              for n in mods:
                  for m in mods:
                      mods[n] = mods[n].replace(G + m, "./" + m)
              for n, c in mods.items():
                  open(B + "/firebase/" + n, "w", encoding="utf-8").write(c)
                  html = html.replace(G + n, "./web-assets/firebase/" + n)
              print("firebase modules ok")
          except Exception as e:
              print("firebase modules skipped:", e)

          # Fixed Unsplash images. Width stays 1100px (that is what the phone has to decode, so the app opens without lag).
          # Only the JPEG quality is raised (95 -> 100) and WebP/AVIF auto-format is forced to plain JPEG:
          # sharper photos and a bigger app (MB), with the SAME decode cost (pixel size unchanged, so no lag).
          urls = sorted(set(re.findall(r'https://images\.unsplash\.com/[^"\'\s)`<>]+', html)), key=len, reverse=True)
          ok = 0
          for u in urls:
              try:
                  big = re.sub(r"w=\d+", "w=1100", u)
                  big = re.sub(r"q=\d+", "q=100", big)
                  # force plain JPEG (auto=format would hand us smaller WebP/AVIF)
                  big = big.replace("auto=format", "fm=jpg")
                  big = re.sub(r"fm=\w+", "fm=jpg", big)
                  if "fm=jpg" not in big:
                      big += ("&" if "?" in big else "?") + "fm=jpg"
                  name = "img/" + hashlib.sha1(big.encode()).hexdigest()[:12] + ".jpg"
                  if not os.path.exists(B + "/" + name):
                      open(B + "/" + name, "wb").write(get(big))
                  html = html.replace(u, "web-assets/" + name)
                  ok += 1
              except Exception as e:
                  print("skip", u, e)
          print("images", ok, "of", len(urls))
          try:
              tot = sum(os.path.getsize(B + "/img/" + f) for f in os.listdir(B + "/img"))
              print("bundled image MB: %.1f" % (tot / 1048576.0))
          except Exception as e:
              print("size print skipped:", e)

          open("www/index.html", "w", encoding="utf-8").write(html)
          PYEOF
          du -sh www/web-assets

      # App-only "native feel" tweaks. Patches ONLY the www/ copy (the one packed into
      # the APK/AAB), so the website (repo index.html) is not changed:
      #  - no text selection / long-press highlight (inputs still work normally)
      #  - no "save image" long-press menu on photos
      #  - (no screen slide/fade any more: screens switch instantly, no white flicker)
      - name: App-only native feel (no text select, no image menu)
        run: |
          python3 - << 'PYEOF'
          p = "www/index.html"
          h = open(p, encoding="utf-8").read()
          inject = """<style id="nesh-app-feel">
          html,body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
          input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;}
          img{-webkit-user-drag:none;-webkit-touch-callout:none;}
          /* Android (Material) feel */
          *{-webkit-tap-highlight-color:transparent;}
          html,body{overscroll-behavior:none;}
          button,a,.add-btn,.btn-primary,.cat-card,.rest-card2,.item-card2,.food-card,.fo-card,.food-item-tile{touch-action:manipulation;}
          .food-card:active,.food-item-tile:active,#food-offers .fo-card:active{transform:none !important;}
          html:not(.nesh-lite) .btn-primary,html:not(.nesh-lite) .add-btn{box-shadow:0 1px 3px rgba(0,0,0,.20),0 2px 6px rgba(43,36,16,.16);}
          #nesh-ripple{position:fixed;overflow:hidden;pointer-events:none;z-index:99990;}
          #nesh-ripple i{position:absolute;border-radius:50%;background:rgba(43,36,16,.16);transform:scale(0);opacity:1;animation:neshRip .45s cubic-bezier(.4,0,.2,1) forwards;}
          @keyframes neshRip{to{transform:scale(1);opacity:0;}}
          /* No screen fade/slide: it showed the white page behind for a moment (looked like a flicker/hang) and moved the layout. Screens switch instantly. */
          </style>
          <script>
          // Weak phones (3 GB RAM or less, or 4 cores or less) get "lite" mode: cheaper card shadows.
          // Stronger phones keep the full look.
          try {
            var _m = navigator.deviceMemory, _c = navigator.hardwareConcurrency;
            if ((_m && _m <= 3) || (_c && _c <= 4)) document.documentElement.classList.add('nesh-lite');
          } catch (e) {}
          document.addEventListener('contextmenu', function (e) {
            var t = e.target;
            if (t && t.tagName !== 'INPUT' && t.tagName !== 'TEXTAREA') e.preventDefault();
          });
          // Material ripple: a soft circle spreads from the touch point, clipped to the tapped button / card.
          // One fixed overlay (compositor-only transform/opacity), the page layout is never changed. Skipped while scrolling.
          (function () {
            var SEL = 'button,.add-btn,.btn-primary,.cat-card,.rest-card2,.item-card2,.food-card,.fo-card,.food-item-tile,.food-chip,.nf-tab,[role="button"]';
            var t0 = null, sx = 0, sy = 0, tgt = null, host = null;
            function clear() { clearTimeout(t0); t0 = null; if (host) { host.remove(); host = null; } }
            document.addEventListener('pointerdown', function (e) {
              try {
                clear();
                tgt = e.target && e.target.closest ? e.target.closest(SEL) : null;
                if (!tgt || tgt.disabled) return;
                sx = e.clientX; sy = e.clientY;
                t0 = setTimeout(function () {
                  try {
                    var r = tgt.getBoundingClientRect();
                    if (r.width < 24 || r.height < 24 || r.width > innerWidth * 1.05 && r.height > innerHeight * 0.6) return;
                    host = document.createElement('div'); host.id = 'nesh-ripple';
                    host.style.cssText = 'left:' + r.left + 'px;top:' + r.top + 'px;width:' + r.width + 'px;height:' + r.height + 'px;border-radius:' + getComputedStyle(tgt).borderRadius;
                    var d = Math.max(r.width, r.height) * 2, i = document.createElement('i');
                    i.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (sx - r.left - d / 2) + 'px;top:' + (sy - r.top - d / 2) + 'px';
                    host.appendChild(i); document.body.appendChild(host);
                    setTimeout(function () { if (host) { host.remove(); host = null; } }, 520);
                  } catch (x) {}
                }, 40);
              } catch (x) {}
            }, { passive: true, capture: true });
            document.addEventListener('pointermove', function (e) { if (t0 && (Math.abs(e.clientX - sx) > 8 || Math.abs(e.clientY - sy) > 8)) clear(); }, { passive: true, capture: true });
            ['pointercancel', 'scroll'].forEach(function (n) { document.addEventListener(n, function () { if (t0) clear(); }, { passive: true, capture: true }); });
          })();
          // Light tap vibration (native feel) on Add / primary buttons. Does nothing if the plugin is missing.
          document.addEventListener('click', function (e) {
            try {
              var t = e.target && e.target.closest && e.target.closest('.add-btn,.btn-primary,#pay-confirm-btn');
              if (!t || t.disabled) return;
              var H = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Haptics;
              if (H && H.impact) H.impact({ style: 'LIGHT' });
            } catch (x) {}
          }, true);
          </script>
          """.replace("\n          ", "\n")
          assert "</head>" in h, "no </head> found"
          h = h.replace("</head>", inject + "</head>", 1)
          open(p, "w", encoding="utf-8").write(h)
          print("app-feel injected")
          PYEOF

      # App-only scroll smoothness for Food / Grocery lists (www/ copy only, website untouched).
      #  - cheaper shadows on the repeated list cards, ONLY on weak phones (html.nesh-lite); strong phones keep the full look
      #  - soft placeholder colour behind list images so a not-yet-loaded image is not a white hole
      #  - decoding="async" on list images that lacked it (decode off the main thread)
      # Every text patch is optional: if the app text changed, it prints a warning and the build goes on.
      - name: App-only scroll smoothness (Food / Grocery lists)
        run: |
          python3 - << 'PYEOF'
          p = "www/index.html"
          h = open(p, encoding="utf-8").read()
          css = """<style id="nesh-scroll-smooth">
          html.nesh-lite .rest-card2{ box-shadow:0 3px 10px rgba(43,36,16,.10) !important; }
          html.nesh-lite .item-card2{ box-shadow:0 2px 8px rgba(43,36,16,.08) !important; }
          img.rest-img, img.item-img, img.food-card-photo, img.food-item-img{ background-color:#F4EDD6; }
          </style>
          """
          assert "</head>" in h, "no </head> found"
          h = h.replace("</head>", css + "</head>", 1)
          for a, b in [
              ('<img class="rest-img" src="${r.bannerImage || r.image}" alt="${r.name}" loading="lazy"',
               '<img class="rest-img" src="${r.bannerImage || r.image}" alt="${r.name}" loading="lazy" decoding="async"'),
              ('<img class="item-img" src="${it.image || \'\'}" alt="${escapeHtml(it.name)}" loading="lazy" onerror',
               '<img class="item-img" src="${it.image || \'\'}" alt="${escapeHtml(it.name)}" loading="lazy" decoding="async" onerror'),
          ]:
              if h.count(a) >= 1:
                  h = h.replace(a, b)
                  print("patched:", a[:40])
              else:
                  print("::warning::smoothness patch text not found:", a[:40])
          open(p, "w", encoding="utf-8").write(h)
          print("scroll smoothness injected")
          PYEOF

      # App-only NESH splash look (www/ copy only): service chips orbit the logo, rising growth arrows, logo-colour loader.
      # Only decoration: the splash logic (when it lifts) is not touched. If the splash markup changed, it warns and goes on.
      - name: App-only NESH splash look
        run: |
          python3 - << 'PYEOF'
          import re
          p = "www/index.html"
          h = open(p, encoding="utf-8").read()
          css = """
          <style id="nesh-splash-brand">
          /* NESH brand splash: service chips orbiting the logo, rising growth arrows, logo-colour loader, staged tagline */
          #nesh-splash .sp-deco{ background-image:radial-gradient(rgba(255,255,255,.2) 1.3px, transparent 1.5px); background-size:24px 24px; }
          #nesh-splash .sp-ring{ display:none; }
          #nesh-splash .sp-orbit{
            --r:min(41vw,162px); position:absolute; left:50%; top:46%; width:calc(var(--r)*2); height:calc(var(--r)*2);
            margin:calc(var(--r)*-1) 0 0 calc(var(--r)*-1); border:1.5px dashed rgba(43,36,16,.22); border-radius:50%;
            animation:spOrb 24s linear infinite;
          }
          #nesh-splash .sp-orbit .o{
            position:absolute; left:50%; top:50%; width:46px; height:46px; margin:-23px 0 0 -23px;
            transform:rotate(var(--a)) translateY(calc(var(--r)*-1)) rotate(calc(var(--a)*-1));
            opacity:1;
          }
          #nesh-splash .sp-orbit .o i{
            display:flex; align-items:center; justify-content:center; width:46px; height:46px; border-radius:50%;
            background:#FFF8DF; box-shadow:0 6px 14px rgba(43,36,16,.22); font-style:normal; font-size:24px; line-height:1;
            animation:spOrbBack 24s linear infinite;
          }
          #nesh-splash .sp-up{
            position:absolute; bottom:-8%; width:var(--s,24px); height:var(--s,24px); color:rgba(255,255,255,.6); opacity:0;
            animation:spRise var(--t,6s) ease-in var(--d,0s) infinite;
          }
          #nesh-splash .sp-tag, #nesh-splash.no-loc .sp-tag{
            top:calc(46% + min(41vw,162px) + 37px); opacity:1; animation:none; font-weight:700; letter-spacing:.2em; color:#2B2410;
          }
          #nesh-splash .sp-tag span{ animation:none; opacity:1; }
          #nesh-splash .sp-tag span:nth-of-type(1){ animation-delay:.45s; }
          #nesh-splash .sp-tag span:nth-of-type(2){ animation-delay:.6s; }
          #nesh-splash .sp-tag span:nth-of-type(3){ animation-delay:.75s; }
          #nesh-splash .sp-tag span:nth-of-type(4){ animation-delay:.9s; }
          #nesh-splash .sp-tag b{ width:5px; height:5px; opacity:1; background:linear-gradient(135deg,#1E6BFF,#FF2D6F); animation:none; }
          #nesh-splash::after{ width:96px; margin-left:-48px; height:5px; border-radius:5px; background:rgba(43,36,16,.14); }
          #nesh-splash::before{ width:36px; margin-left:-48px; height:5px; border-radius:5px; background:linear-gradient(90deg,#1E6BFF,#FF2D6F); animation:spBar3 1.2s ease-in-out infinite; }
          @keyframes spOrb{ to{ transform:rotate(360deg); } }
          @keyframes spOrbBack{ to{ transform:rotate(-360deg); } }
          @keyframes spOrbFade{ from{ opacity:0; } }
          @keyframes spRise{ 0%{ transform:translateY(0); opacity:0; } 15%{ opacity:.8; } 100%{ transform:translateY(-95vh); opacity:0; } }
          @keyframes spWord{ from{ opacity:0; transform:translateY(8px); } }
          @keyframes spBar3{ 0%,100%{ transform:translateX(0); } 50%{ transform:translateX(60px); } }
          /* weak phones: same look, standing still */
          html.nesh-lite #nesh-splash .sp-orbit, html.nesh-lite #nesh-splash .sp-orbit .o i, html.nesh-lite #nesh-splash .sp-glow{ animation:none; }
          html.nesh-lite #nesh-splash .sp-up{ display:none; }
          /* complete from the first frame (the native splash already shows this logo): no fade-in stages, no pulsing, fewer animations = no "hang" look */
          #nesh-splash .sp-logo, #nesh-splash.no-loc .sp-logo{ animation:none !important; opacity:1; transform:translate(-50%,-50%); }
          #nesh-splash .sp-glow{ animation:none !important; }
          #nesh-splash .sp-up{ display:none !important; }
          #nesh-splash .sp-orbit{ will-change:transform; }
          #nesh-splash .sp-orbit .o i{ will-change:transform; }
          </style>
          """.replace("\n          ", "\n")
          deco = """
          <div class="sp-deco" aria-hidden="true">
            <i class="sp-glow"></i>
            <div class="sp-orbit"><span class="o" style="--a:0deg;--d:0.4s"><i>🍔</i></span><span class="o" style="--a:90deg;--d:0.55s"><i>🛒</i></span><span class="o" style="--a:180deg;--d:0.7s"><i>🚕</i></span><span class="o" style="--a:270deg;--d:0.85s"><i>🛍️</i></span></div>
          </div>
          """.replace("\n          ", "\n").strip() + "\n  "
          h2, n = re.subn(r'<div class="sp-deco" aria-hidden="true">.*?</div>\s*(?=<div class="sp-top">)', lambda m: deco, h, count=1, flags=re.S)
          if n != 1:
              print("::warning::splash markup not found - NESH splash look skipped")
          else:
              assert "</head>" in h2, "no </head> found"
              h2 = h2.replace("</head>", css + "\n</head>", 1)
              open(p, "w", encoding="utf-8").write(h2)
              print("NESH splash look injected")
          PYEOF

      # LIVE UPDATE (OTA) support, injected into the www/ copy only (the website index.html is not touched):
      #  - calls notifyAppReady() once the app's own scripts are alive. If a new bundle never gets there
      #    (blank screen / crash on start), the updater rolls back to the previous bundle by itself.
      #  - inside the app the service worker is switched off + old registrations removed, so a cached
      #    index.html can never hide a freshly downloaded bundle.
      #  - hidden diagnostic: tap the App version text in Settings 6 times -> shows the bundle version + this phone's
      #    Device ID (needed once, to put your own phone on the TEST channel).
      - name: App-only live update support (ready signal, no service worker, info gesture)
        run: |
          python3 - << 'PYEOF'
          p = "www/index.html"
          h = open(p, encoding="utf-8").read()
          inject = r"""<script id="nesh-ota">
          (function () {
            function isNative() { try { return !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()); } catch (e) { return false; } }
            function U() { try { return window.Capacitor.Plugins.CapacitorUpdater; } catch (e) { return null; } }
            if (isNative() && 'serviceWorker' in navigator) {
              try {
                navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {});
                navigator.serviceWorker.register = function () { return Promise.reject(new Error('service worker is off inside the app')); };
              } catch (e) {}
            }
            var t0 = Date.now();
            var iv = setInterval(function () {
              try {
                var P = U();
                if (typeof window.setShopLoading === 'function' && P && P.notifyAppReady) { P.notifyAppReady(); clearInterval(iv); }
                else if (Date.now() - t0 > 18000) clearInterval(iv);
              } catch (e) {}
            }, 400);
            // Safety net: launchAutoHide is OFF (instant update), so the plain yellow native splash must never stay stuck.
            // Hide it 5 s after load, and again every time the app comes back from the background.
            function hideSplash() {
              try { var S = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen; if (S && S.hide) S.hide({ fadeOutDuration: 150 }); } catch (e) {}
            }
            window.neshNativeSplashHide = hideSplash;   // index.html calls this once its own splash is really painted
            if (isNative()) {
              setTimeout(hideSplash, 4000);
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') { setTimeout(hideSplash, 600); setTimeout(hideSplash, 3000); }
              });
            }
            function showInfo() {
              try {
                var P = U(); if (!P) return;
                Promise.all([P.getDeviceId(), P.current()]).then(function (r) {
                  var id = r[0].deviceId, v = (r[1].bundle && r[1].bundle.version) || 'builtin';
                  try { navigator.clipboard.writeText(id); } catch (x) {}
                  alert('Live update info\nBundle: ' + v + '\nDevice ID: ' + id);
                });
              } catch (x) {}
            }
            var taps = 0, lastTap = 0;
            document.addEventListener('click', function (e) {
              try {
                var el = e.target && e.target.closest ? e.target.closest('#npf-ver') : null;
                if (!el) return;
                var now = Date.now();
                taps = (now - lastTap < 1500) ? taps + 1 : 1;
                lastTap = now;
                if (taps >= 6) { taps = 0; showInfo(); }
              } catch (x) {}
            }, true);
          })();
          </script>
          """
          assert "</head>" in h, "no </head> found"
          h = h.replace("</head>", inject + "</head>", 1)
          open(p, "w", encoding="utf-8").write(h)
          print("ota support injected")
          PYEOF

      # App-only MINIFY (smaller / faster to parse index.html -> the app opens quicker). Only the www/ copy is changed,
      # the website index.html is not. Whitespace + syntax only, NO name changes, so nothing that calls a function by name breaks.
      # It runs BEFORE the smoke test below, so a minified app that fails to list shops stops the build (nothing reaches Play Store).
      # If minify itself fails, the un-minified app is used. Manual run: tick "skip_minify" to leave it out.
      - name: App-only minify (index.html)
        if: ${{ inputs.skip_minify != true }}
        run: |
          cp www/index.html www/index.before-minify.html
          cat > minify-app.js << 'JSEOF'
          // App-only minify of www/index.html (the website copy in the repo is NOT touched).
          // Whitespace + syntax minify only: NO renaming of any variable/function names, so inline onclick="..." handlers,
          // window.* globals and code that shares names between the separate <script> blocks keep working.
          // Every block is minified on its own; if one block fails, that block simply stays as it was.
          const fs = require('fs');
          const esbuild = require(process.env.ESBUILD_PATH || 'esbuild');
          const file = 'www/index.html';
          const src = fs.readFileSync(file, 'utf8');
          let jsDone = 0, jsKept = 0, cssDone = 0, cssKept = 0;

          let out = src.replace(/<script(\s[^>]*)?>([\s\S]*?)<\/script>/gi, (all, attrs, body) => {
            attrs = attrs || '';
            if (/\ssrc\s*=/i.test(attrs) || !body.trim()) return all;
            const t = (attrs.match(/\stype\s*=\s*["']?([^"'\s>]+)/i) || [])[1];
            if (t && !/^(module|text\/javascript|application\/javascript)$/i.test(t)) return all;   // JSON-LD, templates...
            try {
              const r = esbuild.transformSync(body, { minifyWhitespace: true, minifySyntax: true, minifyIdentifiers: false, charset: 'utf8', legalComments: 'none', target: 'esnext' });
              jsDone++;
              return '<script' + attrs + '>' + r.code.replace(/\n+$/, '') + '</script>';
            } catch (e) { jsKept++; console.log('script kept as is:', String(e.message).split('\n')[0]); return all; }
          });

          out = out.replace(/<style(\s[^>]*)?>([\s\S]*?)<\/style>/gi, (all, attrs, body) => {
            if (!body.trim()) return all;
            try {
              const r = esbuild.transformSync(body, { loader: 'css', minifyWhitespace: true, charset: 'utf8', legalComments: 'none' });
              cssDone++;
              return '<style' + (attrs || '') + '>' + r.code.trim() + '</style>';
            } catch (e) { cssKept++; console.log('style kept as is:', String(e.message).split('\n')[0]); return all; }
          });

          if (out.length < src.length * 0.4) { console.log('result looks wrong (too small) - keeping the original'); process.exit(0); }
          fs.writeFileSync(file, out);
          console.log('minify: scripts ' + jsDone + ' ok / ' + jsKept + ' kept, styles ' + cssDone + ' ok / ' + cssKept + ' kept, ' +
            Math.round(src.length / 1024) + ' KB -> ' + Math.round(out.length / 1024) + ' KB');
          JSEOF
          if npm install --prefix /tmp/esb esbuild --no-audit --no-fund --silent; then
            ESBUILD_PATH=/tmp/esb/node_modules/esbuild node minify-app.js || cp www/index.before-minify.html www/index.html
          else
            echo "esbuild could not be installed - minify skipped, app stays as is"
          fi
          rm -f www/index.before-minify.html minify-app.js
          ls -l www/index.html

      # SAFETY CHECK: opens the exact www/ app in a real headless Chrome (like a
      # first-time customer, empty cache) BEFORE the Android build.
      # The build FAILS (nothing reaches Play Store) if:
      #  - a bundled file (web-assets/...) or index.html is missing
      #  - a module / import error happens (the bug that hid all shops)
      #  - Firebase did not load, or no shops are listed within ~2 minutes
      # Other small JS errors only show as warnings in the log.
      # Only on a manual run, tick "skip_smoke_test" if the check itself is wrong.
      - name: Smoke test - app must load and list shops
        if: ${{ inputs.skip_smoke_test != true }}
        run: |
          pip install playwright -q
          # azure.archive.ubuntu.com mirror is unreachable from the runner -> use the main Ubuntu mirror instead
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*; do
            [ -f "$f" ] && sudo sed -i 's#azure.archive.ubuntu.com#archive.ubuntu.com#g; s#http://security.ubuntu.com#http://archive.ubuntu.com#g; s#https://security.ubuntu.com#https://archive.ubuntu.com#g' "$f" || true
          done
          sudo apt-get clean
          ok=0
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 || true
            if timeout 300 python3 -m playwright install --with-deps chromium; then ok=1; break; fi
            echo "Attempt $i failed, retrying in 15s..."; sleep 15
          done
          # Fallback: browser only (runner already has most libraries) - do not fail the build because of apt
          if [ "$ok" != "1" ]; then
            echo "::warning::apt deps failed, trying browser download only"
            python3 -m playwright install chromium
          fi
          python3 - << 'PYEOF'
          import sys, threading, functools, http.server, socketserver
          from playwright.sync_api import sync_playwright

          class Q(http.server.SimpleHTTPRequestHandler):
              def log_message(self, *a): pass
          socketserver.ThreadingTCPServer.allow_reuse_address = True
          srv = socketserver.ThreadingTCPServer(("127.0.0.1", 8765), functools.partial(Q, directory="www"))
          threading.Thread(target=srv.serve_forever, daemon=True).start()
          BASE = "http://localhost:8765"
          problems, warnings = [], []

          with sync_playwright() as p:
              b = p.chromium.launch()
              ctx = b.new_context(
                  viewport={"width": 412, "height": 915},
                  timezone_id="Asia/Kolkata", locale="en-IN",
                  geolocation={"latitude": 9.8667, "longitude": 76.3},
                  permissions=["geolocation"])
              # The app detects the customer's country from the IP address (api.country.is / ipapi.co).
              # GitHub runners are in the US, so without this the app would switch to "abroad / Pravasi"
              # mode and not list the normal Food shops. Pretend this test customer is in India.
              ctx.route("https://api.country.is/**", lambda r: r.fulfill(status=200, content_type="application/json", headers={"access-control-allow-origin": "*"}, body='{"country":"IN"}'))
              ctx.route("https://ipapi.co/**", lambda r: r.fulfill(status=200, content_type="text/plain", headers={"access-control-allow-origin": "*"}, body="IN"))
              ctx.add_init_script("try{localStorage.setItem('nesh_ip_cc',JSON.stringify({cc:'IN',t:Date.now()}))}catch(e){}")
              # The shop list now comes from https://api.neshapp.in (Oracle). The test page runs on http://localhost:8765,
              # an origin the API does not allow (CORS), so the browser blocks the call (net::ERR_FAILED) although the real app is fine.
              # Fetch the REAL answer from the API and only add the CORS headers, so the real data path is still tested.
              def _oracle(route):
                  h = {"access-control-allow-origin": "*", "access-control-allow-headers": "*", "access-control-allow-methods": "GET,POST,OPTIONS"}
                  if route.request.method == "OPTIONS":
                      return route.fulfill(status=204, headers=h)
                  try:
                      r = route.fetch()
                      hh = dict(r.headers); hh.update(h)
                      route.fulfill(response=r, headers=hh)
                  except Exception as e:
                      warnings.append("api.neshapp.in not reachable from the runner: " + str(e)[:150])
                      route.abort()
              ctx.route("https://api.neshapp.in/**", _oracle)
              page = ctx.new_page()
              cons = []
              wsb = [0]
              def _ws(ws):
                  def _fr(f):
                      try: wsb[0] += len(f["payload"] if isinstance(f, dict) else f)
                      except Exception: pass
                  ws.on("framereceived", _fr)
              page.on("websocket", _ws)
              page.on("console", lambda m: cons.append(m.type + ": " + m.text[:300]) if m.type in ("error", "warning") else None)

              def on_err(e):
                  m = str(e)
                  low = m.lower()
                  if "module" in low or "import" in low or "specifier" in low:
                      problems.append("JS module error: " + m)
                  else:
                      warnings.append("JS error: " + m)
              page.on("pageerror", on_err)

              def on_resp(r):
                  if r.url.startswith(BASE) and r.status >= 400 and "favicon" not in r.url:
                      msg = "HTTP %s  %s" % (r.status, r.url)
                      (problems if ("web-assets" in r.url or r.url.endswith("index.html")) else warnings).append(msg)
              page.on("response", on_resp)

              def on_fail(r):
                  if r.url.startswith(BASE) and "ERR_ABORTED" not in (r.failure or ""):
                      problems.append("request failed  %s  %s" % (r.url, r.failure))
              page.on("requestfailed", on_fail)

              page.goto(BASE + "/index.html", wait_until="domcontentloaded")

              def wait(expr, secs):
                  try:
                      page.wait_for_function(expr, timeout=secs * 1000)
                      return True
                  except Exception:
                      return False

              SHOPS = "Array.isArray(window.RESTAURANTS) && window.RESTAURANTS.length > 0"
              mod_ok = wait("typeof window.setShopLoading === 'function'", 30)
              db_ok = mod_ok and wait("Array.isArray(window.SHOP_ZONES)", 45)
              shops_ok = db_ok and wait(SHOPS, 25)
              if db_ok and not shops_ok:
                  # Try EVERY zone that lists shops, not just the first one. A zone can list shops
                  # that are inactive / deleted (only status=active shops are shown), which gives
                  # 0 shops even though the app itself is fine.
                  JS = """(zi) => {
                    try {
                      const z = (window.SHOP_ZONES || []).filter(z => z.shopIds.length).sort((a, b) => a.shopIds.length - b.shopIds.length)[zi];
                      const n = z.bounds.length;
                      const c = { lat: z.bounds.reduce((a, p) => a + p.lat, 0) / n, lng: z.bounds.reduce((a, p) => a + p.lng, 0) / n };
                      const pts = [c].concat(z.bounds.map(p => ({ lat: c.lat + (p.lat - c.lat) * 0.5, lng: c.lng + (p.lng - c.lng) * 0.5 })));
                      const hit = pts.find(q => isPointInZone(q, z.bounds));
                      if (!hit) return z.name + ' (' + z.shopIds.length + ' ids): no test point inside zone';
                      state.customerPos = hit;
                      return z.name + ' (' + z.shopIds.length + ' ids) ' + JSON.stringify(hit);
                    } catch (e) { return 'error: ' + e; }
                  }"""
                  nz = page.evaluate("(window.SHOP_ZONES || []).filter(z => z.shopIds.length).length")
                  print("zones that list shops:", nz)

                  # A zone can still list ids of deleted / inactive shops (e.g. an empty zone). Ask Firebase directly
                  # which zones really have an ACTIVE shop and only try those (smallest first = least to download).
                  good = page.evaluate("""async () => {
                    const zs = (window.SHOP_ZONES || []).filter(z => z.shopIds.length).sort((a, b) => a.shopIds.length - b.shopIds.length);
                    const out = [];
                    for (let i = 0; i < zs.length; i++) {
                      let act = 0;
                      for (const id of zs[i].shopIds.slice(0, 6)) {
                        try {
                          const r = await fetch('https://texi-and-food-default-rtdb.firebaseio.com/restaurants/' + encodeURIComponent(id) + '/status.json');
                          if ((await r.text()).replace(/"/g, '') === 'active') act++;
                        } catch (e) {}
                      }
                      out.push([i, zs[i].name, act]);
                    }
                    return out;
                  }""")
                  print("active shops (of first 6 ids) per zone:", good)
                  order = [g[0] for g in good if g[2] > 0]

                  page.evaluate("""() => { const o = window.setShopLoading; window.__ssl = []; window.setShopLoading = function (m, ids) { try { window.__ssl.push(m + ':' + (ids || []).length); } catch (e) {} return o.apply(this, arguments); }; }""")
                  STATE_JS = """() => {
                    let se = 'ok';
                    try { syncShopLoading(); } catch (e) { se = 'ERR ' + e; }
                    return JSON.stringify({ setShopLoadingCalls: (window.__ssl || []).slice(-6), syncNow: se, zones: (window.SHOP_ZONES || []).length, restaurants: (window.RESTAURANTS || []).length, pending: !!(window.neshShopsPending && window.neshShopsPending()) });
                  }"""
                  for n_try, zi in enumerate(order):
                      print("trying zone:", page.evaluate(JS, zi))
                      page.wait_for_timeout(6000)
                      print("  [after 6s]", page.evaluate(STATE_JS), "| data KB:", wsb[0] // 1024)
                      if wait(SHOPS, 90 if n_try == 0 else 15):
                          shops_ok = True
                          break
                      st = page.evaluate("""() => { try { return JSON.stringify({ abroad: neshIsAbroad(), abroadActive: neshAbroadActive(), pos: state.customerPos, loadingShops: !!(window.neshShopsPending && window.neshShopsPending()), restaurants: (window.RESTAURANTS || []).length }); } catch (e) { return 'state error: ' + e; } }""")
                      print("  -> 0 shops in this zone | Firebase data received so far: %d KB | %s" % (wsb[0] // 1024, st))

              if not shops_ok:
                  print("---- DIAGNOSTICS (why 0 shops) ----")
                  probe = page.evaluate("""async () => {
                    const z = (window.SHOP_ZONES || []).find(z => z.shopIds.length);
                    const out = [];
                    if (!z) return ['no zone with shop ids'];
                    for (const id of z.shopIds.slice(0, 3)) {
                      for (const f of ['status', 'menu']) {
                        try {
                          const r = await fetch('https://texi-and-food-default-rtdb.firebaseio.com/restaurants/' + encodeURIComponent(id) + '/' + f + '.json');
                          const t0 = Date.now(); const tx = await r.text(); out.push(id + '/' + f + ' -> HTTP ' + r.status + '  ' + Math.round(tx.length / 1024) + ' KB in ' + (Date.now() - t0) + ' ms  ' + tx.slice(0, 40));
                        } catch (e) { out.push(id + '/' + f + ' -> fetch error ' + e); }
                      }
                    }
                    return out;
                  }""")
                  for x in probe: print("probe:", x)
                  for x in cons[-20:]: print("console:", x)
              n = page.evaluate("(window.RESTAURANTS || []).length") if shops_ok else 0
              b.close()

          print("Firebase module loaded :", mod_ok)
          print("Firebase data arrived  :", db_ok)
          print("Shops listed           :", shops_ok, "(%d shops)" % n)
          for x in warnings: print("::warning::", x)
          for x in problems: print("PROBLEM:", x)
          if problems or not (mod_ok and db_ok and shops_ok):
              print("::error::App check failed - shops did not load. Build stopped, nothing was built.")
              sys.exit(1)
          print("Smoke test passed")
          PYEOF

      - name: Init npm + install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli
          npm install @capacitor/app
          npm install @capacitor/geolocation
          npm install @capacitor/push-notifications
          npm install @capacitor/local-notifications
          npm install @capacitor/share
          npm install @capacitor/haptics
          npm install @capacitor-firebase/authentication firebase
          npm install @capawesome/capacitor-app-update
          npm install @capacitor/camera @capacitor/browser @capacitor/network @capacitor/device @capacitor/clipboard
          # needed by the updater's instant-apply modes (autoSplashscreen)
          npm install @capacitor/splash-screen
          # Live Update plugin: its major version must match Capacitor's major version
          CAP_MAJOR=$(node -p "require('./node_modules/@capacitor/core/package.json').version.split('.')[0]")
          echo "Capacitor major: $CAP_MAJOR"
          npm install "@capgo/capacitor-updater@${CAP_MAJOR}"
          npm install @capacitor/assets --save-dev

      # Debug aid: shows exactly which Capacitor / Firebase plugin versions this build got.
      - name: Show installed plugin versions
        run: npm ls --depth=0 || true

      # IMPORTANT: appId must stay exactly the same as the package name
      # already live on Play Store (com.neshgroup.nesh), otherwise Play
      # Console will treat this as a brand-new app instead of an update.
      - name: Create capacitor.config.json
        env:
          OTA_UPDATE_URL: ${{ vars.OTA_UPDATE_URL }}
        run: |
          python3 - << 'PYEOF'
          import json, os
          cfg = {
              "appId": "com.neshgroup.nesh",
              "appName": "NESH",
              "webDir": "www",
              "backgroundColor": "#F2B705",
              "android": {"adjustMarginsForEdgeToEdge": "disable"},
              "plugins": {
                  "SystemBars": {"insetsHandling": "disable"},
                  "SplashScreen": {"launchShowDuration": 0, "launchAutoHide": False, "backgroundColor": "#F2B705", "showSpinner": False},
                  "FirebaseAuthentication": {"providers": ["phone"]}
              }
          }
          url = os.environ.get("OTA_UPDATE_URL", "").strip()
          if url:
              # Live Update: checks our own server (never Capgo's cloud: statsUrl/channelUrl are empty).
              # directUpdate=false: the app opens at once (no waiting on the first screen for the update check, which looked like a hang).
              # The newest production bundle is downloaded quietly in the background and used from the NEXT launch.
              # (To get the old behaviour back - wait up to 2.5 s and apply the update immediately - set directUpdate to "always",
              #  autoSplashscreen to True and uncomment the launchAutoHide line below.)
              cfg["plugins"]["CapacitorUpdater"] = {
                  "autoUpdate": True,
                  "updateUrl": url,
                  "statsUrl": "",
                  "channelUrl": "",
                  "appReadyTimeout": 20000,
                  "directUpdate": "onLaunch",
                  "persistCustomId": True,
                  "autoSplashscreen": True,
                  "autoSplashscreenTimeout": 2500,
                  "resetWhenUpdate": True,
                  "autoDeleteFailed": True,
                  "autoDeletePrevious": True
              }
              # (only needed with autoSplashscreen=True: the native splash must then NOT auto-hide)
              # cfg["plugins"]["SplashScreen"]["launchAutoHide"] = False
              print("Live Update is ON ->", url)
          else:
              print("::warning::repo variable OTA_UPDATE_URL is not set - Live Update is OFF in this build")
          json.dump(cfg, open("capacitor.config.json", "w"), indent=2)
          print(open("capacitor.config.json").read())
          PYEOF

      - name: Add Android platform
        run: npx cap add android

      - name: Force target SDK 36 + newer Gradle/AGP
        run: |
          sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 24/; s/compileSdkVersion = [0-9]+/compileSdkVersion = 36/; s/targetSdkVersion = [0-9]+/targetSdkVersion = 36/' android/variables.gradle
          sed -i -E "s#(com.android.tools.build:gradle:)[0-9.]+#\18.9.1#" android/build.gradle
          sed -i -E 's#gradle-[0-9.]+-(all|bin).zip#gradle-8.11.1-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          # default download timeout is only 10 s -> raise it to 2 min
          sed -i -E '/^networkTimeout=/d' android/gradle/wrapper/gradle-wrapper.properties
          echo 'networkTimeout=120000' >> android/gradle/wrapper/gradle-wrapper.properties
          cat android/variables.gradle
          grep "com.android.tools.build:gradle" android/build.gradle
          cat android/gradle/wrapper/gradle-wrapper.properties

      # Wires up Firebase Cloud Messaging (needed for push notifications).
      # google-services.json is committed to the repo root — it's a
      # client config file, not a secret, so it's fine to keep in git
      # (Firebase does not treat it as sensitive).
      - name: Add Firebase config for push notifications
        run: |
          cp google-services.json android/app/google-services.json
          sed -i "s#classpath 'com.android.tools.build:gradle.*#&\n        classpath 'com.google.gms:google-services:4.4.2'#" android/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          grep -n "google-services" android/build.gradle android/app/build.gradle

      # The native splash (shown by Android before the WebView loads) must be
      # a plain yellow screen - no logo, no dark background - so it blends
      # straight into the in-app "Locating..." splash in index.html.
      # splash.png is replaced by a generated solid #F2B705 image.
      - name: Generate app icon + plain yellow splash
        run: |
          mkdir -p assets
          pip install pillow -q
          # Legacy (square/round) launcher icons: the full glossy icon.
          cp icon-1024.png assets/icon-only.png
          # Adaptive icon (Android 8+): Android crops the outer ~1/3 with a
          # circle/squircle mask, so the icon is shrunk into the safe zone on
          # a transparent layer, over a solid brand-yellow background layer.
          python3 - << 'PYEOF'
          from PIL import Image
          ic = Image.open('icon-1024.png').convert('RGBA')
          fg = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          small = ic.resize((600, 600), Image.LANCZOS)
          fg.paste(small, (212, 212), small)
          fg.save('assets/icon-foreground.png')
          Image.new('RGB', (1024, 1024), (0xF2, 0xB7, 0x05)).save('assets/icon-background.png')
          PYEOF
          python3 - << 'PYEOF'
          import zlib, struct
          W = H = 2732
          def chunk(t, d):
              c = struct.pack('>I', len(d)) + t + d
              return c + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)
          raw = (b'\x00' + bytes([0xF2, 0xB7, 0x05]) * W) * H
          png = (b'\x89PNG\r\n\x1a\n'
                 + chunk(b'IHDR', struct.pack('>IIBBBBB', W, H, 8, 2, 0, 0, 0))
                 + chunk(b'IDAT', zlib.compress(raw, 9))
                 + chunk(b'IEND', b''))
          open('assets/splash.png', 'wb').write(png)
          PYEOF
          npx capacitor-assets generate --android \
            --splashBackgroundColor '#F2B705' \
            --splashBackgroundColorDark '#F2B705'

      # Android 12+ ignores splash.png and draws its own splash (app icon on
      # a dark/theme background). Force that one to yellow with no icon too.
      # Now the NESH logo is shown on that first yellow screen (the same logo as the in-app splash), so the customer
      # never sees an empty yellow screen while the app starts. The logo is taken from the in-app splash itself
      # (index.html), so both always match. If anything fails, it falls back to the plain yellow splash.
      - name: Make Android 12+ system splash yellow (with NESH logo)
        run: |
          python3 - << 'PYEOF'
          import re, base64, io, os
          icon_ref = "@android:color/transparent"
          try:
              from PIL import Image
              html = open("index.html", encoding="utf-8").read()
              m = re.search(r'<div class="sp-logo">\s*<img[^>]*src="data:image/(?:webp|png);base64,([^"]+)"', html)
              assert m, "splash logo not found in index.html"
              logo = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert("RGBA")
              bb = logo.getchannel("A").point(lambda a: 255 if a > 20 else 0).getbbox()
              if bb: logo = logo.crop(bb)
              # Android draws this icon inside a circle (2/3 of a 288dp square) -> keep the logo well inside it
              S = 1152
              side = int(S * 0.47)
              logo.thumbnail((side, side), Image.LANCZOS)
              canvas = Image.new("RGBA", (S, S), (0, 0, 0, 0))
              canvas.paste(logo, ((S - logo.width) // 2, (S - logo.height) // 2), logo)
              d = "android/app/src/main/res/drawable-nodpi"
              os.makedirs(d, exist_ok=True)
              canvas.save(d + "/nesh_splash_logo.png")
              icon_ref = "@drawable/nesh_splash_logo"
              print("native splash logo generated", logo.size)
          except Exception as e:
              print("::warning::native splash logo skipped (plain yellow splash kept):", e)
          path = "android/app/src/main/res/values/styles.xml"
          s = open(path).read()
          m = re.search(r'<style name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>', s, re.S)
          assert m, "NoActionBarLaunch style not found"
          block = m.group(0)
          if 'Theme.SplashScreen' in block:
              extra = (
                  '\n        <item name="windowSplashScreenBackground">#F2B705</item>'
                  '\n        <item name="windowSplashScreenAnimatedIcon">' + icon_ref + '</item>'
                  '\n    </style>'
              )
              s = s.replace(block, block.replace('</style>', extra))
              open(path, "w").write(s)
          print(open(path).read())
          PYEOF
          # Dark-mode variant (if the template ships one) must not override it
          rm -f android/app/src/main/res/values-night/styles.xml || true

      # Status bar (top bar with time/battery) must be yellow, not dark grey.
      # Set it natively in the app theme so it works without relying on JS.
      - name: Make status bar yellow in Android theme
        run: |
          python3 - << 'PYEOF'
          import re
          path = "android/app/src/main/res/values/styles.xml"
          s = open(path).read()
          extra = (
              '\n        <item name="android:windowLightStatusBar">true</item>'
              '\n        <item name="android:statusBarColor">@android:color/transparent</item>'
              '\n        <item name="android:windowBackground">#F2B705</item>'
              '\n    </style>'
          )
          for name in ("AppTheme.NoActionBar", "AppTheme.NoActionBarLaunch"):
              m = re.search(r'<style name="%s"[^>]*>.*?</style>' % re.escape(name), s, re.S)
              if m:
                  s = s.replace(m.group(0), m.group(0).replace('</style>', extra))
          open(path, "w").write(s)
          print(s)
          PYEOF

      # On Android 15/16 the system ignores statusBarColor, and the strip
      # behind the status bar shows the WINDOW background instead. Paint it
      # yellow from MainActivity. Also registers a tiny native plugin
      # (NeshLocation) used ONLY when the customer taps "Turn on location"
      # in the popup: shows Google's own "Turn on device location? OK" dialog.
      - name: MainActivity (yellow window) + native "turn on GPS" dialog
        run: |
          python3 - << 'PYEOF'
          import glob, os
          F = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)[0]
          D = os.path.dirname(F)
          pkg = [l for l in open(F) if l.startswith("package ")][0].strip()
          open(F, "w").write(pkg + """

          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsAnimationCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              // Keyboard: the page is resized ONCE when the keyboard has finished sliding (not on every animation frame),
              // so the layout does not shake / lag while the keyboard opens or closes.
              private boolean imeDeferred = false;
              private WindowInsetsCompat lastInsets = null;

              private void applyPad(View v) {
                  if (v == null || lastInsets == null) return;
                  int types = WindowInsetsCompat.Type.systemBars() | WindowInsetsCompat.Type.displayCutout();
                  if (!imeDeferred) types |= WindowInsetsCompat.Type.ime();
                  Insets bars = lastInsets.getInsets(types);
                  v.setPadding(bars.left, bars.top, bars.right, bars.bottom);
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NeshLocationPlugin.class);
                  registerPlugin(NeshUpiPlugin.class);
                  super.onCreate(savedInstanceState);

                  // Edge-to-edge done the recommended way (all Android versions):
                  // the app draws edge-to-edge, and we pad the content by the
                  // system bar insets. The yellow window background shows behind
                  // the status bar. No deprecated status-bar colour APIs used.
                  Window w = getWindow();
                  WindowCompat.setDecorFitsSystemWindows(w, false);
                  w.setBackgroundDrawable(new ColorDrawable(Color.parseColor("#F2B705")));
                  WindowCompat.getInsetsController(w, w.getDecorView()).setAppearanceLightStatusBars(true);
                  WindowCompat.getInsetsController(w, w.getDecorView()).setAppearanceLightNavigationBars(true);

                  View content = findViewById(android.R.id.content);
                  ViewCompat.setOnApplyWindowInsetsListener(content, (v, insets) -> {
                      lastInsets = insets;
                      applyPad(v);
                      return WindowInsetsCompat.CONSUMED;
                  });
                  try {
                      ViewCompat.setWindowInsetsAnimationCallback(content,
                          new WindowInsetsAnimationCompat.Callback(WindowInsetsAnimationCompat.Callback.DISPATCH_MODE_CONTINUE_ON_SUBTREE) {
                              @Override
                              public void onPrepare(WindowInsetsAnimationCompat animation) {
                                  if ((animation.getTypeMask() & WindowInsetsCompat.Type.ime()) != 0) {
                                      imeDeferred = true;
                                      final View c = findViewById(android.R.id.content);
                                      // safety: never stay in "deferred" mode if the end callback does not arrive
                                      if (c != null) c.postDelayed(() -> { if (imeDeferred) { imeDeferred = false; applyPad(c); } }, 700);
                                  }
                              }

                              @Override
                              public WindowInsetsCompat onProgress(WindowInsetsCompat insets, List<WindowInsetsAnimationCompat> running) {
                                  return insets;
                              }

                              @Override
                              public void onEnd(WindowInsetsAnimationCompat animation) {
                                  if (imeDeferred && (animation.getTypeMask() & WindowInsetsCompat.Type.ime()) != 0) {
                                      imeDeferred = false;
                                      applyPad(findViewById(android.R.id.content));
                                  }
                              }
                          });
                  } catch (Throwable t) { imeDeferred = false; }
                  ViewCompat.requestApplyInsets(content);

                  // The page must never slide sideways (left part cut off + yellow strip on the right).
                  // If the WebView's horizontal scroll ever becomes non-zero, snap it straight back to 0.
                  try {
                      final android.webkit.WebView wv = getBridge().getWebView();
                      wv.setHorizontalScrollBarEnabled(false);
                      wv.setOverScrollMode(View.OVER_SCROLL_NEVER);
                      wv.setOnScrollChangeListener((v, sx, sy, ox, oy) -> { if (sx != 0) v.scrollTo(0, sy); });
                  } catch (Throwable t) { }
              }
          }
          """.replace("\n          ", "\n"))
          open(D + "/NeshLocationPlugin.java", "w").write(pkg + """

          import androidx.activity.ComponentActivity;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.IntentSenderRequest;
          import androidx.activity.result.contract.ActivityResultContracts;
          import android.app.Activity;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.google.android.gms.common.api.ResolvableApiException;
          import com.google.android.gms.location.LocationRequest;
          import com.google.android.gms.location.LocationServices;
          import com.google.android.gms.location.LocationSettingsRequest;
          import com.google.android.gms.location.Priority;

          @CapacitorPlugin(name = "NeshLocation")
          public class NeshLocationPlugin extends Plugin {
              private PluginCall pending;
              private ActivityResultLauncher<IntentSenderRequest> launcher;

              @Override
              public void load() {
                  try {
                      ComponentActivity act = (ComponentActivity) getActivity();
                      launcher = act.getActivityResultRegistry().register(
                          "nesh_location_settings",
                          new ActivityResultContracts.StartIntentSenderForResult(),
                          result -> {
                              PluginCall c = pending;
                              pending = null;
                              if (c != null) done(c, result.getResultCode() == Activity.RESULT_OK ? "on" : "declined");
                          });
                  } catch (Throwable t) {
                      launcher = null;
                  }
              }

              // state: "on" (GPS is on), "declined" (user tapped No thanks), "error" (could not ask)
              private void done(PluginCall call, String state) {
                  try {
                      JSObject o = new JSObject();
                      o.put("enabled", "on".equals(state));
                      o.put("declined", "declined".equals(state));
                      o.put("state", state);
                      call.resolve(o);
                  } catch (Throwable ignored) { }
              }

              @PluginMethod
              public void enable(final PluginCall call) {
                  try {
                      if (getActivity() == null || launcher == null || pending != null) { done(call, "error"); return; }
                      LocationRequest req = new LocationRequest.Builder(Priority.PRIORITY_HIGH_ACCURACY, 10000).build();
                      LocationSettingsRequest lsr = new LocationSettingsRequest.Builder()
                          .addLocationRequest(req).setAlwaysShow(true).build();
                      LocationServices.getSettingsClient(getActivity()).checkLocationSettings(lsr)
                          .addOnSuccessListener(r -> done(call, "on"))
                          .addOnFailureListener(e -> {
                              try {
                                  if (e instanceof ResolvableApiException) {
                                      pending = call;
                                      launcher.launch(new IntentSenderRequest.Builder(
                                          ((ResolvableApiException) e).getResolution()).build());
                                  } else {
                                      done(call, "error");
                                  }
                              } catch (Throwable t) {
                                  pending = null;
                                  done(call, "error");
                              }
                          });
                  } catch (Throwable t) {
                      pending = null;
                      done(call, "error");
                  }
              }
          }
          """.replace("\n          ", "\n"))
          open(D + "/NeshUpiPlugin.java", "w").write(pkg + """

          import android.app.Activity;
          import android.content.Intent;
          import android.content.ActivityNotFoundException;
          import android.net.Uri;
          import androidx.activity.ComponentActivity;
          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          // Opens the phone's UPI app chooser with the amount already filled in and
          // hands the UPI app's result back to the page (success / failure / pending / cancelled / no_app).
          @CapacitorPlugin(name = "NeshUpi")
          public class NeshUpiPlugin extends Plugin {
              private PluginCall pending;
              private ActivityResultLauncher<Intent> launcher;

              @Override
              public void load() {
                  try {
                      ComponentActivity act = (ComponentActivity) getActivity();
                      launcher = act.getActivityResultRegistry().register(
                          "nesh_upi_pay",
                          new ActivityResultContracts.StartActivityForResult(),
                          result -> {
                              PluginCall c = pending;
                              pending = null;
                              if (c == null) return;
                              String resp = null;
                              Intent d = result.getData();
                              if (d != null) {
                                  resp = d.getStringExtra("response");
                                  if (resp == null) resp = d.getStringExtra("Response");
                              }
                              finish(c, result.getResultCode(), resp);
                          });
                  } catch (Throwable t) {
                      launcher = null;
                  }
              }

              private static String pick(String resp, String key) {
                  if (resp == null) return "";
                  String[] parts = resp.split("&");
                  for (String p : parts) {
                      int i = p.indexOf('=');
                      if (i > 0 && p.substring(0, i).trim().equalsIgnoreCase(key)) return p.substring(i + 1).trim();
                  }
                  return "";
              }

              private void finish(PluginCall call, int resultCode, String resp) {
                  try {
                      String status;
                      String st = pick(resp, "Status");
                      if (resp == null || resp.length() == 0) {
                          status = (resultCode == Activity.RESULT_CANCELED) ? "cancelled" : "unknown";
                      } else if (st.equalsIgnoreCase("SUCCESS")) {
                          status = "success";
                      } else if (st.equalsIgnoreCase("FAILURE") || st.equalsIgnoreCase("FAILED")) {
                          status = "failure";
                      } else if (st.equalsIgnoreCase("SUBMITTED") || st.equalsIgnoreCase("PENDING")) {
                          status = "pending";
                      } else {
                          status = "unknown";
                      }
                      JSObject o = new JSObject();
                      o.put("status", status);
                      o.put("raw", resp == null ? "" : resp);
                      o.put("txnId", pick(resp, "txnId"));
                      o.put("txnRef", pick(resp, "txnRef"));
                      o.put("responseCode", pick(resp, "responseCode"));
                      call.resolve(o);
                  } catch (Throwable ignored) { }
              }

              private void fail(PluginCall call, String status) {
                  try {
                      JSObject o = new JSObject();
                      o.put("status", status);
                      call.resolve(o);
                  } catch (Throwable ignored) { }
              }

              @PluginMethod
              public void pay(final PluginCall call) {
                  try {
                      String url = call.getString("url");
                      if (url == null || !url.startsWith("upi://") || getActivity() == null || launcher == null || pending != null) {
                          fail(call, "error");
                          return;
                      }
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                      pending = call;
                      launcher.launch(Intent.createChooser(i, "Pay with"));
                  } catch (ActivityNotFoundException e) {
                      pending = null;
                      fail(call, "no_app");
                  } catch (Throwable t) {
                      pending = null;
                      fail(call, "error");
                  }
              }
          }
          """.replace("\n          ", "\n"))
          PYEOF
