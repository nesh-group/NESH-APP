      # Silent OTA push: the server sends a data-only FCM message {"nesh_ota":"1"}. This service wakes even when the
      # app is closed and asks the updater's own HeadlessUpdateWorker to download the newest bundle, so the next open is
      # already on the new version. Normal pushes still go to the Capacitor push plugin (we extend its service and
      # remove the original one from the manifest so only one service receives FCM messages).
      - name: Silent OTA push receiver (native)
        run: |
          python3 - << 'PYEOF'
          import glob, os
          M = "android/app/src/main/AndroidManifest.xml"
          F = glob.glob("android/app/src/main/java/**/MainActivity.java", recursive=True)[0]
          D = os.path.dirname(F)
          pkg = [l for l in open(F) if l.startswith("package ")][0].strip()
          pkgname = pkg.replace("package ", "").replace(";", "").strip()
          open(D + "/NeshMessagingService.java", "w").write(pkg + """

          import com.capacitorjs.plugins.pushnotifications.MessagingService;
          import com.google.firebase.messaging.RemoteMessage;
          import ee.forgr.capacitor_updater.HeadlessUpdateWorker;

          public class NeshMessagingService extends MessagingService {
              @Override
              public void onMessageReceived(RemoteMessage message) {
                  try {
                      if ("1".equals(message.getData().get("nesh_ota"))) {
                          // silent update check: never shown to the user, never passed to the web app
                          HeadlessUpdateWorker.enqueue(getApplicationContext());
                          return;
                      }
                  } catch (Throwable t) {
                      // an update problem must never break normal pushes
                  }
                  super.onMessageReceived(message);
              }
          }
          """.replace("\n          ", "\n"))
          s = open(M).read()
          if "xmlns:tools=" not in s:
              s = s.replace("<manifest ", '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          svc = (
              '    <service android:name="com.capacitorjs.plugins.pushnotifications.MessagingService" tools:node="remove" />\n'
              '    <service android:name="' + pkgname + '.NeshMessagingService" android:exported="false">\n'
              '        <intent-filter><action android:name="com.google.firebase.MESSAGING_EVENT" /></intent-filter>\n'
              '    </service>\n'
          )
          assert "</application>" in s, "application end tag not found"
          s = s.replace("</application>", svc + "</application>", 1)
          open(M, "w").write(s)
          PYEOF
          printf '\ndependencies {\n    implementation "com.google.firebase:firebase-messaging:25.0.1"\n    implementation "androidx.work:work-runtime:2.9.1"\n}\n' >> android/app/build.gradle
