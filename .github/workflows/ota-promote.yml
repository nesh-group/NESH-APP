name: Promote OTA test bundle to production (all users)

# Run this ONLY after the bundle works on your own phone (TEST channel).
# It copies the exact tested bundle inside R2 (test/ -> production/) - nothing is rebuilt.
on:
  workflow_dispatch:
    inputs:
      send_push:
        description: "Send silent OTA push after promote (needs server secrets)"
        type: boolean
        default: false
      push_target:
        description: "Only if send_push: topic name (e.g. the zone topic)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Copy test/ -> production/ in R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.OTA_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.OTA_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.OTA_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.OTA_R2_BUCKET }}
        run: |
          set -e
          mkdir ota && cd ota
          aws s3 cp "s3://${R2_BUCKET}/test/manifest.json" manifest.json --endpoint-url "$R2_ENDPOINT"
          ZIP=$(python3 -c "import json;print(json.load(open('manifest.json'))['zip'])")
          SUM=$(python3 -c "import json;print(json.load(open('manifest.json'))['checksum'])")
          aws s3 cp "s3://${R2_BUCKET}/test/${ZIP}" "$ZIP" --endpoint-url "$R2_ENDPOINT"
          [ "$(sha256sum "$ZIP" | cut -d' ' -f1)" = "$SUM" ] || { echo "::error::checksum mismatch - not promoted"; exit 1; }
          # zip first, manifest last
          aws s3 cp "$ZIP" "s3://${R2_BUCKET}/production/${ZIP}" --endpoint-url "$R2_ENDPOINT" --content-type application/zip --cache-control "public, max-age=31536000, immutable"
          aws s3 cp manifest.json "s3://${R2_BUCKET}/production/manifest.json" --endpoint-url "$R2_ENDPOINT" --content-type application/json --cache-control "no-cache"
          for A in $(aws s3 ls "s3://${R2_BUCKET}/production/" --endpoint-url "$R2_ENDPOINT" | awk '{print $4}' | grep -E '^nesh-bundle-.*\.zip$'); do
            [ "$A" = "$ZIP" ] || aws s3 rm "s3://${R2_BUCKET}/production/$A" --endpoint-url "$R2_ENDPOINT"
          done
          curl -fsI --retry 3 --retry-delay 3 "https://ota.neshapp.in/production/${ZIP}" >/dev/null && echo "public URL ok" || echo "::warning::production URL not reachable - check the custom domain"
          echo "Promoted $ZIP to production"

      - name: Silent OTA push (optional, off by default)
        if: ${{ inputs.send_push }}
        env:
          SSH_KEY: ${{ secrets.NESH_PUSH_SSH_KEY }}
          SSH_HOST: ${{ secrets.NESH_PUSH_SSH_HOST }}
          SSH_USER: ${{ secrets.NESH_PUSH_SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.NESH_PUSH_KNOWN_HOSTS }}
          PUSH_TARGET: ${{ inputs.push_target }}
        run: |
          set -e
          [ -n "$PUSH_TARGET" ] || { echo "::error::push_target is empty"; exit 1; }
          case "$PUSH_TARGET" in *[!A-Za-z0-9_-]*) echo "::error::bad topic name"; exit 1;; esac
          # manifest is cached 60 s on the server - wait before the push
          sleep 90
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_push && chmod 600 ~/.ssh/id_push
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # server-side authorized_keys must force: command="/opt/nesh-api/ota-push-wrapper.sh"
          ssh -i ~/.ssh/id_push -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" "topic $PUSH_TARGET"
